[project]
name = "zomic"
version = "2.0.0"
description = "Web komik (manga reader) berbasis FastAPI — katalog lengkap komiku.org"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "pydantic>=2.0,<3.0",
    "requests>=2.31,<3.0",
    "Pillow>=10.0,<13.0",
]

# Build backend eksplisit + nonaktifkan auto-discovery paket: layout datar ini
# (app.py di root, web/ & api/ hanya folder aset/entrypoint) membuat setuptools
# menolak build dengan "Multiple top-level packages discovered (['api','web'])".
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = ["app", "komiku_web"]

[tool.fastapi]
entrypoint = "app:app"
