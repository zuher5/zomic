services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ZOMIC_DB: /data/zomic.db
      STORAGE_ROOT: /data/images
      ZOMIC_ADMIN_TOKEN: ${ZOMIC_ADMIN_TOKEN}
    volumes:
      - zomic-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: python -m scraper.worker_cli
    environment:
      ZOMIC_DB: /data/zomic.db
      STORAGE_ROOT: /data/images
      IMAGE_REFERER: https://v3.komikcast.fit/
    volumes:
      - zomic-data:/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  zomic-data:
