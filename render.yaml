services:
  - type: web
    name: zomic
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: IMAGE_CACHE_DIR
        value: /tmp/zomic-image-cache
      - key: IMAGE_MAX_BYTES
        value: "12582912"
      - key: IMAGE_MAX_PIXELS
        value: "25000000"
      - key: IMAGE_CACHE_TTL
        value: "2592000"
      - key: IMAGE_SOURCE_CACHE_TTL
        value: "604800"
      - key: IMAGE_CACHE_MAX_BYTES
        value: "268435456"