    const pages = Array.isArray(imgs) ? imgs : (imgs.images || []);
    const chapters = (detail?.chapters || []).filter(c => c.ch);
    const i = chapters.findIndex(c => String(c.ch) === String(ch));
    const prev = i > 0 ? chapters[i - 1] : null;
    const next = i >= 0 && i < chapters.length - 1 ? chapters[i + 1] : null;
    const title = detail?.title || humanTitle(slug);
    if (detail) pushHistory({ slug, ch, title, cover: detail.cover || '', pos: i >= 0 ? i + 1 : 0, total: chapters.length });

    const back = detailHref(slug);
    const fnav = (c, dir) => c
      ? `<a class="pill" href="${readHref(slug, c.ch)}" aria-label="${dir < 0 ? 'Previous chapter' : 'Next chapter'}">${svg(dir < 0 ? 'chevL' : 'chevR')}</a>`
      : `<span class="pill" aria-disabled="true" aria-label="${dir < 0 ? 'No previous chapter' : 'No next chapter'}">${svg(dir < 0 ? 'chevL' : 'chevR')}</span>`;

    view.innerHTML = `
      <div class="rbar top">
        <div class="inner">
          <a class="icon-btn" href="${back}" data-back aria-label="Back to comic detail">${svg('arrowL')}</a>
          <span class="rmeta"><strong>${esc(title)}</strong><span>Chapter ${esc(ch)}</span></span>
          <button class="icon-btn" id="sheetBtn" aria-label="Chapter list" aria-expanded="false" aria-controls="sheet">${svg('list')}</button>
        </div>
        <div class="progress" id="prog"></div>
      </div>

      <div class="pages" id="pages">${pages.map((u, n) =>
        `<div class="pg" data-pg="${n}"><img data-src="${IMG(u)}" data-pg="${n}" alt="Page ${n + 1}" ${n < 3 ? 'loading="eager"' : 'loading="lazy"'} decoding="async"
          onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src=this.dataset.src;}else{this.replaceWith(Object.assign(document.createElement('div'),{className:'pfail',textContent:'Page ${n + 1} failed to load'}))}"></div>`).join('')}
      </div>

      <div class="rend">
        <p class="label">Chapter ${esc(ch)} finished</p>
        <div class="actions nav3">
          <span class="side left">${fnav(prev, -1)}</span>
          <a class="btn" href="${back}" data-back>Detail</a>
          <span class="side right">${fnav(next, 1)}</span>
        </div>
      </div>

      <div class="floater" id="floater">
        ${fnav(prev, -1)}
        <button class="playfab" id="autoScroll" aria-label="Autoscroll" aria-pressed="false">${svg('play')}</button>
        ${fnav(next, 1)}
      </div>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Chapter list" aria-hidden="true" inert>
        <div class="shead"><span class="label">${chapters.length} chapter</span>
          <button class="icon-btn" id="sheetClose" aria-label="Close chapter list">${svg('x')}</button></div>
        <div class="slist">${[...chapters].reverse().map(c => {
          const done = readSet(slug).has(String(c.ch));
          const cur = String(c.ch) === String(ch);
          return `<a href="${readHref(slug, c.ch)}" aria-current="${cur}" class="${done && !cur ? 'read' : ''}">
            <span>${esc(c.title || 'Chapter ' + c.ch)}${done && !cur ? '<span class="rd">\u2713</span>' : ''}</span>
            <span class="muted mono">${esc(c.date || '')}</span></a>`}).join('')}</div>
      </div>`;

    window.scrollTo(0, 0);
    readerNav = {
      prev: prev && readHref(slug, prev.ch),
      next: next && readHref(slug, next.ch),
      back,
      total: pages.length,
    };
    showChrome(true);
    chromeTimer = setTimeout(() => showChrome(false), 5000);
    mountReaderImages();
    // Restore last scroll position for this chapter, after first paint.
    // Sudah ditandai dibaca saat dibuka (markRead di atas); blok akhir
    // hanya untuk menandai selesai penuh bila diperlukan.
    const saved = readPos(slug);
    if (saved && String(saved.ch) === String(ch) && saved.y > 40) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        window.scrollTo(0, saved.y);
      }));
    }
    // Chapter dianggap dibaca begitu dibuka: tandai langsung, tanpa ambang
    // scroll. Position tracking (savePos) tetap jalan untuk resume.
    markRead(slug, ch);
    clearPos(slug);
    // Dipanggil route() saat pindah halaman (prev/next chapter, back ke
    // detail, dsb): scroll listener lama ikut dibersihkan saat view diganti.
    window.__readerExit = () => { window.removeEventListener('scroll', saveTick); };
    let posTick = 0;
    const maxScroll = () => Math.max(1, document.body.scrollHeight - window.innerHeight);
    const finishObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(en => {
      if (en[0].isIntersecting) {
        markRead(slug, ch);
        clearPos(slug);
        finishObserver.disconnect();
      }
    }, { threshold: 0.4 }) : null;
    const endEl = $('.rend');
    if (endEl && finishObserver) finishObserver.observe(endEl);
    const saveTick = () => {
      const now = Date.now();
      if (now - posTick > 1000) { posTick = now; savePos(slug, ch, window.scrollY, maxScroll()); }
    };
    window.addEventListener('scroll', saveTick, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { savePos(slug, ch, window.scrollY, maxScroll()); autoLast = performance.now(); }
    });

    const sheet = $('#sheet'), scrim = $('#scrim'), sheetBtn = $('#sheetBtn');
    const renderSheetList = () => {
      const list = $('.slist', sheet);
      if (!list) return;
      const read = readSet(slug);
      list.innerHTML = [...chapters].reverse().map(c => {
        const done = read.has(String(c.ch));
        const cur = String(c.ch) === String(ch);
        return `<a href="${readHref(slug, c.ch)}" aria-current="${cur}" class="${done && !cur ? 'read' : ''}">
          <span>${esc(c.title || 'Chapter ' + c.ch)}${done && !cur ? '<span class="rd">\u2713</span>' : ''}</span>
          <span class="muted mono">${esc(c.date || '')}</span></a>`}).join('');
    };
    const setSheet = open => {
      sheet.dataset.open = String(open);
      scrim.dataset.open = String(open);
      sheet.setAttribute('aria-hidden', String(!open));
      sheet.toggleAttribute('inert', !open);
      sheetBtn.setAttribute('aria-expanded', String(open));
      if (open) {
        renderSheetList(); // segarkan dari readSet terkini (markRead bisa
        // terjadi setelah sheet pertama di-render)
        showChrome(true); clearTimeout(chromeTimer);
        const cur = $('.slist a[aria-current="true"]', sheet);
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
        (cur || $('#sheetClose'))?.focus?.({ preventScroll: true });
      } else {
        sheetBtn.focus?.({ preventScroll: true });
      }
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) autoLast = performance.now();
    }, { once: true });
    sheetBtn.onclick = () => { stopAutoscroll(); setSheet(sheet.dataset.open !== 'true'); };
    $('#sheetClose').onclick = () => setSheet(false);
    scrim.onclick = () => setSheet(false);
    closeSheet = () => setSheet(false);
    $('#pages').addEventListener('click', e => {
      if (e.target.closest('.floater')) return;
      if (sheet.dataset.open === 'true') return setSheet(false);
      if (e.target.closest('a, button, input')) return;
      if (e.clientY > window.innerHeight * 0.70) {
        tapScrollBlock = true;
        setTimeout(() => { tapScrollBlock = false; }, 100);
        showChrome(false); // force fullscreen: UI sembunyi langsung
        window.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
        return;
      }
      // Tap mid-screen always reveals UI (never toggles off).
      showChrome(true);
      clearTimeout(chromeTimer);
      chromeTimer = setTimeout(() => showChrome(false), 5000);
    });
    const fab = $('#autoScroll');
    // Pointer capture keeps press+release on the button even if the finger
    // drifts a pixel; click would otherwise land outside and need a retry.
    fab.addEventListener('pointerdown', e => { try { fab.setPointerCapture(e.pointerId); } catch {} });
    fab.addEventListener('click', e => { e.stopPropagation(); toggleAutoscroll(); });
    const rendEl = $('.rend');
    if (rendEl && 'IntersectionObserver' in window) {
      new IntersectionObserver(en => {
        $('#floater')?.classList.toggle('at-end', en[0].isIntersecting);
      }, { threshold: 0.15 }).observe(rendEl);
    }
  } catch (e) { document.body.dataset.view = ''; fail(e); }
}

let chromeTimer = null, lastY = 0, ticking = false, closeSheet = null, tapScrollBlock = false;
function showChrome(on) { document.body.classList.toggle('chrome', on); }

/* Reader buffering: .pg placeholder (indikator loading) meng-<img> di dalamnya. */
function mountReaderImages() {
  if (readerObserver) readerObserver.disconnect();
  const slots = $$('#pages .pg');
  if (!slots.length) return;
  // Pasangkan wrapper + <img>-nya; buang slot yang img-nya sudah hilang.
  const pairs = slots
    .map(s => ({ slot: s, img: s.querySelector('img') }))
    .filter(p => p.img);
  if (!pairs.length) return;
  const imgs = pairs.map(p => p.img);
  const slotOf = img => pairs.find(p => p.img === img)?.slot || img.closest('.pg');
  // Decode-then-show: gambar tetap opacity 0 (placeholder .pg ber-den) selama
  // byte mengalir, baru tampil setelah browser selesai decode frame PENUH.
  // JPEG dari CDN bersifat PROGRESIF (SOF2, ~3 scan) — kalau ditampilkan saat
  // decode belum selesai, Chrome merender scan kasar dulu lalu memperbaikinya →
  // terlihat "thumbnail yang membesar". Karena itu TIDAK ADA fallback yang
  // menampilkan gambar tanpa decode; kalau decode() reject, dicoba ulang
  // (max 3x) dengan jeda, baru tampil paksa setelah img.complete.
  const show = img => {
    img.classList.add('done');
    // Placeholder ikut done → shimmer berhenti & min-height dilepas, tinggi
    // kembali mengikuti rasio asli halaman komik.
    slotOf(img)?.classList.add('done');
  };
  const showWhenReady = img => {
    if (!img || img.dataset.shown) return;
    img.dataset.shown = '1';
    // Double rAF: pastikan frame ter-commit ke layar SEBELUM opacity naik,
    // supaya tidak pernah ada frame dengan gambar setengah jadi.
    const reveal = () => requestAnimationFrame(() => requestAnimationFrame(() => show(img)));
    let tries = 0;
    const attempt = () => {
      if (!img.complete) { img.addEventListener('load', attempt, { once: true }); return; }
      let p;
      try { p = img.decode(); }
      catch { reveal(); return; }
      if (p && p.then) {
        p.then(reveal, () => {
          if (++tries < 3) setTimeout(attempt, 80); // decode belum siap, ulangi
          else reveal();                            // sudah complete, tampil
        });
      } else reveal();
    };
    attempt();
  };
  // Antrean bertahap anti-spike: maksimal 2 unduhan paralel + jeda antar
  // start, prioritas = urutan halaman. Menggantikan pola lama (3 eager
  // sekaligus + warm 3 Image paralel) yang menghantam sinyal sekaligus.
  const MAX_PARALLEL = 2, START_GAP = 120;
  const inFlight = new Set();
  const queue = [];
  let lastStart = 0;
  const pump = () => {
    while (inFlight.size < MAX_PARALLEL && queue.length) {
      const img = queue.shift();
      if (!img || img.dataset.loaded) continue;
      inFlight.add(img);
      const wait = Math.max(0, START_GAP - (performance.now() - lastStart));
      lastStart = performance.now() + wait;
      setTimeout(() => load(img, img.dataset.src), wait);
    }
  };
  const settle = img => { if (inFlight.delete(img)) pump(); };
  const enqueue = img => {
    if (!img || img.dataset.loaded || img.dataset.queued) return;
    img.dataset.queued = '1';
    // Sisip berdasar nomor halaman agar tampil tetap berurutan.
    const pg = Number(img.dataset.pg) || 0;
    let at = queue.findIndex(q => (Number(q.dataset.pg) || 0) > pg);
    if (at < 0) at = queue.length;
    queue.splice(at, 0, img);
    pump();
  };
  const load = (img, src) => {
    if (!img || img.dataset.loaded) { settle(img); return; }
    img.dataset.loaded = '1';
    // Reference wrapper diambil SEBELUM request: saat gambar gagal total, <img>
    // dilepas dari DOM (onerror inline) sehingga closest('.pg') jadi null.
    const slot = slotOf(img);
    img.addEventListener('load', () => { showWhenReady(img); settle(img); }, { once: true });
    // Gagal → placeholder jangan menggantung ber-den 60svh; lepaskan juga.
    img.addEventListener('error', () => { slot?.classList.add('done'); settle(img); }, { once: true });
    img.src = src;
    // Gambar cache bisa selesai sebelum listener terpasang.
    if (img.complete && img.naturalWidth) showWhenReady(img);
    setTimeout(() => settle(img), 15000); // pengaman slot tak macet
  };
  // Halaman pertama langsung antre terdepan (LCP cepat via pump instan).
  enqueue(imgs[0]);
  // Observe WRAPPER .pg, bukan <img>: sebelum load, <img> tinggi-nya 0
  // (min-height ada di .pg) dan IO pada elemen nol-tinggi tidak andal.
  readerObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const pair = pairs.find(p => p.slot === en.target);
      if (!pair || !en.isIntersecting || pair.img.dataset.loaded) return;
      enqueue(pair.img);
      // Lookahead: cukup 1 halaman berikut, ikut antre (tak langsung tembak).
      const n = Number(pair.img.dataset.pg) || 0;
      if (imgs[n + 1]) enqueue(imgs[n + 1]);
    });
  }, { rootMargin: '800px 0px' });
  pairs.forEach((p, i) => { if (p.img !== imgs[0]) readerObserver.observe(p.slot); });
}

/* Autoscroll. */
let autoRaf = null, autoLast = 0;
const AUTO_PX = 96; // steady px per second

function stopAutoscroll() {
  if (autoRaf) { cancelAnimationFrame(autoRaf); autoRaf = null; }
  document.body.classList.remove('autoscroll');
  const fab = $('#autoScroll');
  if (fab) {
    fab.innerHTML = svg('play');
    fab.setAttribute('aria-pressed', 'false');
    fab.setAttribute('aria-label', 'Autoscroll');
  }
}

function startAutoscroll() {
  document.body.classList.add('autoscroll');
  const fab = $('#autoScroll');
  if (fab) {
    fab.innerHTML = svg('pause');
    fab.setAttribute('aria-pressed', 'true');
    fab.setAttribute('aria-label', 'Stop autoscroll');
  }
  showChrome(true); clearTimeout(chromeTimer);
  chromeTimer = setTimeout(() => showChrome(false), 5000);
  autoLast = performance.now();
  const step = t => {
    const px = Math.max(0.5, (t - autoLast) / 1000 * AUTO_PX);
    autoLast = t;
    window.scrollBy(0, px);
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
      stopAutoscroll();
      return;
    }
    autoRaf = requestAnimationFrame(step);
  };
  autoRaf = requestAnimationFrame(step);
}

function toggleAutoscroll() {
  if (document.body.classList.contains('autoscroll')) stopAutoscroll(); else startAutoscroll();
}

/* Tap anywhere reveals UI and keeps it up ~5s; page taps handled in #pages. */
document.addEventListener('click', e => {
  if (document.body.dataset.view !== 'reader') return;
  if (tapScrollBlock) return;
  if (e.target.closest('.floater')) return;
  if (e.target.closest('#pages')) return;
  if (e.target.closest('.rbar, .sheet, .scrim, .botnav, header, a, button, input')) return;
  clearTimeout(chromeTimer);
  showChrome(true);
  chromeTimer = setTimeout(() => showChrome(false), 5000);
});

function onReaderScroll() {
  const y = window.scrollY;
  // During autoplay the programmatic scrollBy would immediately re-hide the
  // UI; let the 5s chrome timer own visibility then, not scroll direction.
  if (!document.body.classList.contains('autoscroll') && Math.abs(y - lastY) > 10) {
    showChrome(y < lastY || y < 40);
  }
  lastY = y;
  const el = $('#pages'), prog = $('#prog');
  if (el && prog) {
    const max = el.offsetTop + el.offsetHeight - window.innerHeight;
    const pct = max > 0 ? Math.min(1, Math.max(0, y / max)) : 1;
    prog.style.width = (pct * 100).toFixed(1) + '%';
  }
}
window.addEventListener('scroll', () => {
  if (document.body.dataset.view !== 'reader' || ticking) return;
  ticking = true;
  requestAnimationFrame(() => { onReaderScroll(); ticking = false; });
}, { passive: true });

/* Navigation + router. */
const NAV = [
  { href: '/',          key: '',         label: 'Home',       icon: 'home' },
  { href: '/explore',   key: 'explore',  label: 'Explore',   icon: 'grid' },
  { href: '/genre',     key: 'genre',    label: 'Genre',     icon: 'tags' },
  { href: '/collection', key: 'collection', label: 'Collection', icon: 'bookmark' },
];
const DESKNAV = [...NAV];

/* Legacy section names map to current nav items. */
const NAV_ALIAS = { favorites: 'collection', history: 'collection', collection: 'collection', explore: 'explore', katalog: 'explore' };

function renderNav(active) {
  const key = NAV_ALIAS[active] || active;
  $('#botnav').innerHTML = NAV.map(n =>
    `<a href="${n.href}" ${n.key === key ? 'aria-current="page"' : ''}>${svg(n.icon)}<span>${n.label}</span></a>`).join('');
  $('#desknav').innerHTML = DESKNAV.map(n =>
    `<a href="${n.href}" ${n.key === key ? 'aria-current="page"' : ''}>${n.label}</a>`).join('');
}

let _navCount = 0;
let _routeGen = 0; // bumped per route() to cancel stale renders

function go(url, replace = false) {
  const curSeg = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  const nextSeg = url.split('?')[0].split('/').filter(Boolean).map(decodeURIComponent);

  if (curSeg[0] === 'read' && nextSeg[0] === 'read' && curSeg[1] === nextSeg[1]) {
    replace = true;
  } else if (curSeg[0] === 'read' && nextSeg[0] === 'manga' && curSeg[1] === nextSeg[1] && _navCount > 0) {
    window.history.back();
    return;
  } else if (nextSeg[0] === 'read' && nextSeg[1]) {
    const detail = `/manga/${encodeURIComponent(nextSeg[1])}`;
    if (location.pathname !== detail) {
      window.history.pushState({ inReader: false }, '', detail);
      _navCount++;
    }
  }

  const state = nextSeg[0] === 'read' ? { inReader: true } : { inReader: false };
  if (replace) window.history.replaceState(state, '', url);
  else window.history.pushState(state, '', url);
  if (!replace) _navCount++;
  route();
}

function route() {
  _routeGen++;
  if (window.__readerExit) { try { window.__readerExit(); } catch {} window.__readerExit = null; }
  readerNav = null;
  if (readerObserver) { readerObserver.disconnect(); readerObserver = null; }
  closeSheet = null;
  stopAutoscroll();
  clearTimeout(chromeTimer);
  document.body.classList.remove('chrome');
  document.body.dataset.view = '';
  $('#top').classList.remove('open');
  $('#searchToggle').setAttribute('aria-expanded', 'false');
  lastY = 0;

  const seg = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  const params = new URLSearchParams(location.search);
  renderNav(seg[0] || '');
  window.scrollTo(0, 0);

  switch (seg[0]) {
    case undefined: return pageHome();
    case 'popular': return pagePopuler();
    case 'explore': return pageCatalog(Number(params.get('page')) || 1, params);
    case 'search': return params.get('q') ? pageSearch(params.get('q'), Number(params.get('page')) || 1) : pageHome();
    case 'genre': return seg[1] ? pageGenre(seg[1], Number(params.get('page')) || 1) : pageGenres();
    case 'collection': return pageKoleksi(params);
    case 'manga': return seg[1] ? pageDetail(seg[1]) : pageHome();
    case 'read': return seg[1] && seg[2] ? pageReader(seg[1], seg[2]) : pageHome();
    default: return pageHome();
  }
}
window.addEventListener('popstate', () => { _navCount = Math.max(0, _navCount - 1); route(); });

/* Global interaction. */
$$('[data-search]').forEach(f => f.addEventListener('submit', e => {
  e.preventDefault();
  const q = f.querySelector('input').value.trim();
  if (!q) return;
  // Enter saat ada saran yang aktif = buka tujuan saran itu, bukan halaman hasil.
  const pick = pickSuggest(f);
  if (pick) { closeSuggest(f); f.querySelector('input').blur(); go(pick._go || detailHref(pick.slug)); return; }
  go(`/search?q=${encodeURIComponent(q)}`);
  f.querySelector('input').blur();
}));

/* --- Search typeahead (dropdown judul sesuai keyword) ---
   Satu modul untuk kedua form search (desktop .search-inline & mobile
   .search-row). Fetch punya signal sendiri supaya request yang sudah
   berjalan bisa dibatalkan saat user mengetik lagi (tidak ada balasan
   basi yang menimpa render terbaru). */
const SUGG_MIN_CHARS = 2;
const SUGG_DEBOUNCE_MS = 300;
const SUGG_MAX = 4;
const SUGG_MAX_CACHE = 50;
const suggCache = new Map();   // query -> items (bounded, LRU-ish by delete)

function suggCacheGet(q) {
  if (!suggCache.has(q)) return null;
  const v = suggCache.get(q);
  suggCache.delete(q); suggCache.set(q, v);   // tandai baru dipakai
  return v;
}
function suggCacheSet(q, items) {
  suggCache.set(q, items);
  while (suggCache.size > SUGG_MAX_CACHE) suggCache.delete(suggCache.keys().next().value);
}

/* Highlight substring yang cocok. Input user di-escape dulu, lalu teks asli
   dipecah per case-insensitive match; tiap bagian di-escape terpisah. */
function markTitle(title, q) {
  const t = String(title || '');
  const needle = q.trim().toLowerCase();
  if (!needle) return esc(t);
  const low = t.toLowerCase();
  let out = '', i = 0;
  for (;;) {
    const at = low.indexOf(needle, i);
    if (at < 0) { out += esc(t.slice(i)); break; }
    out += esc(t.slice(i, at)) + '<mark>' + esc(t.slice(at, at + needle.length)) + '</mark>';
    i = at + needle.length;
  }
  return out;
}

async function fetchSuggest(q, signal) {
  const res = await fetch('/api/search?q=' + encodeURIComponent(q), { signal });
  if (!res.ok) throw new Error('sugg ' + res.status);
  const d = await res.json();
  return Array.isArray(d.items) ? d.items : [];
}

// Thumbnail saran: satu ukuran tetap tanpa srcset — cover di dropdown hanya
// 40px (2/3) sehingga varian 240/400/800 milik grid utama tidak berguna.
// w=120 adalah MINIMUM yang diizinkan backend /api/img (Query ge=120); angka
// di bawah itu dijawab 422 dan cover tidak akan muncul sama sekali.
const suggThumb = u => u
  ? `<img data-cover loading="lazy" decoding="async" src="${opt(u, 120)}" alt="" onerror="this.remove()">`
  : '';

function wireSuggest(form) {
  const input = form.querySelector('input');
  const panel = form.querySelector('.sugg');
  if (!input || !panel) return;
  // id panel dipakai aria-controls; input harus unik per form.
  const opts = [];            // item pada render terakhir
  let cur = -1;               // index opsi aktif (-1 = tidak ada)
  let timer = null;
  let ctl = null;
  let lastQ = '';

  function open() {
    panel.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  }
  function close() {
    panel.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
    cur = -1;
  }
  function setCur(i) {
    opts.forEach((_, n) => {
      const el = panel.children[n];
      if (el && el.setAttribute) el.setAttribute('aria-selected', String(n === i));
    });
    cur = i;
    if (i >= 0 && panel.children[i] && panel.children[i].scrollIntoView) {
      panel.children[i].scrollIntoView({ block: 'nearest' });
    }
    input.setAttribute('aria-activedescendant', i >= 0 ? panel.id + '-o' + i : '');
  }
  // Dipakai oleh handler submit global: item yang sedang aktif untuk dibuka,
  // dan closure close asli (bukan sekadar flag state) supaya panel benar-benar
  // tertutup saat navigasi. Setiap opsi punya _go = URL tujuan.
  form._pick = () => (cur >= 0 ? opts[cur] : null);
  form._close = close;

  function render(q, items) {
    opts.length = 0;
    panel.innerHTML = '';
    if (!items.length) {
      panel.innerHTML = `<p class="none">No titles match &ldquo;${esc(q)}&rdquo;</p>`;
      open();
      return;
    }
    items.slice(0, SUGG_MAX).forEach((it, n) => {
      const slug = it.slug;
      if (!slug) return;
      const go = detailHref(slug);
      it._go = go;
      opts.push(it);
      const a = document.createElement('a');
      a.href = go;
      a.id = panel.id + '-o' + (opts.length - 1);
      a.setAttribute('role', 'option');
      a.setAttribute('aria-selected', 'false');
      a.innerHTML = `<span class="sc">${it.cover ? suggThumb(it.cover) : `<span class="ph">${initials(it.title)}</span>`}</span>
        <span class="st"><span class="t">${markTitle(it.title, q)}</span></span>`;
      panel.appendChild(a);
    });
    // Baris terakhir: "See all results". Baris ini ikut masuk opts (index
    // terakhir) lalu diputar ArrowUp/Down seperti hasil biasa, jadi bisa
    // dijangkau keyboard; _go-nya arah ke halaman hasil, bukan detail.
    const allGo = `/search?q=${encodeURIComponent(q)}`;
    const seeAll = { slug: '', title: 'See all results', _go: allGo };
    opts.push(seeAll);
    const a2 = document.createElement('a');
    a2.className = 'all';
    a2.href = allGo;
    a2.id = panel.id + '-o' + (opts.length - 1);
    a2.setAttribute('role', 'option');
    a2.setAttribute('aria-selected', 'false');
    a2.innerHTML = `<span class="t">See all results</span>`;
    panel.appendChild(a2);
    setCur(-1);
    open();
  }

  function lookup(q) {
    lastQ = q;
    const hit = suggCacheGet(q);
    if (hit) { render(q, hit); return; }
    if (ctl) ctl.abort();
    ctl = new AbortController();
    const mine = ctl;
    fetchSuggest(q, mine.signal)
      .then(items => {
        if (mine.signal.aborted || lastQ !== q) return;   // sudah basi
        suggCacheSet(q, items);
        render(q, items);
      })
      .catch(() => { /* batal/timeout: biarkan panel apa adanya */ });
  }

  input.setAttribute('role', 'combobox');
  input.setAttribute('aria-expanded', 'false');
  input.setAttribute('aria-controls', panel.id);
  input.setAttribute('aria-autocomplete', 'list');
  input.setAttribute('autocomplete', 'off');

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(timer);
    if (q.length < SUGG_MIN_CHARS) { if (ctl) ctl.abort(); close(); return; }
    timer = setTimeout(() => lookup(q), SUGG_DEBOUNCE_MS);
  });

  // Fokus lagi dengan query yang sama: tampilkan hasil cache tanpa fetch.
  input.addEventListener('focus', () => {
    const q = input.value.trim();
    if (q.length >= SUGG_MIN_CHARS && suggCacheGet(q)) lookup(q);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { close(); return; }
    if (panel.hidden || !opts.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setCur((cur + 1) % opts.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setCur(cur <= 0 ? opts.length - 1 : cur - 1);
    } else if (e.key === 'Enter' && cur >= 0) {
      e.preventDefault();          // submit handler yang membuka item
    }
  });

  // Klik di dalam panel: cegah blur lebih dulu (pointerdown), lalu navigasi
  // lewat router yang sudah ada (tDelegasi a[href] di document).
  panel.addEventListener('pointerdown', e => { e.preventDefault(); });
  panel.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    close();
    input.blur();
  });

  document.addEventListener('pointerdown', e => {
    if (!form.contains(e.target)) close();
  });
}
$$('[data-search]').forEach(wireSuggest);
const pickSuggest = form => (form && form._pick ? form._pick() : null);
const closeSuggest = form => { if (form && form._close) form._close(); };

$('#searchToggle').onclick = () => {
  const top = $('#top');
  const open = top.classList.toggle('open');
  $('#searchToggle').setAttribute('aria-expanded', String(open));
  if (open) $('#searchRow input').focus();
};

document.addEventListener('click', e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const fav = t.closest('[data-fav]');
  if (fav) {
    e.preventDefault();
    const on = toggleFav(fav.dataset.fav, { title: fav.dataset.title, cover: fav.dataset.cover });
    fav.innerHTML = fav.querySelector('.fav-txt') ? favBtnContent(on) : favIcn(on);
    fav.setAttribute('aria-pressed', String(on));
    fav.setAttribute('aria-label', on ? 'Remove from favorites' : 'Add to favorites');
    return;
  }
  if (t.closest('[data-retry]')) { route(); return; }
  const pOpen = t.closest('[data-open-pagesheet]');
  if (pOpen) {
    const sheet = $('#pSheet'), scrim = $('#pScrim');
    if (sheet && scrim) {
      sheet.dataset.open = 'true';
      scrim.dataset.open = 'true';
      sheet.setAttribute('aria-hidden', 'false');
      sheet.removeAttribute('inert');
      pOpen.setAttribute('aria-expanded', 'true');
      const curEl = $('.pgrid a[aria-current="page"]', sheet);
      if (curEl?.scrollIntoView) setTimeout(() => curEl.scrollIntoView({ block: 'center' }), 50);
    }
    return;
  }
  const pClose = t.closest('[data-close-pagesheet]');
  if (pClose) {
    const sheet = $('#pSheet'), scrim = $('#pScrim');
    if (sheet && scrim) {
      sheet.dataset.open = 'false';
      scrim.dataset.open = 'false';
      sheet.setAttribute('aria-hidden', 'true');
      sheet.setAttribute('inert', '');
      $('[data-open-pagesheet]')?.setAttribute('aria-expanded', 'false');
    }
    return;
  }
  const back = t.closest('[data-back]');
  if (back) {
    e.preventDefault();
    const fallback = back.getAttribute('href') || '/';
    if (_navCount > 0) window.history.back(); else go(fallback);
    return;
  }
  const a = t.closest('a[href]');
  if (a) {
    const href = a.getAttribute('href');
    if (href && href.startsWith('/') && !href.startsWith('//') &&
        !href.startsWith('/api/') && !href.startsWith('/fonts/') && href !== '/health') {
      e.preventDefault();
      go(href);
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-jump]');
  if (!f) return;
  e.preventDefault();
  const n = Number(f.querySelector('input').value);
  if (n > 0) go(f.dataset.jump.replace('__P__', n));
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t instanceof Element && t.matches('input,select,textarea')) return;
  if (e.key === 'Escape') {
    const ps = $('#pSheet');
    if (ps && ps.dataset.open === 'true') {
      ps.dataset.open = 'false';
      $('#pScrim')?.setAttribute('data-open', 'false');
      ps.setAttribute('aria-hidden', 'true');
      ps.setAttribute('inert', '');
      $('[data-open-pagesheet]')?.setAttribute('aria-expanded', 'false');
      return;
    }
    if ($('#sheet')?.dataset.open === 'true') { closeSheet?.(); return; }
  }
  if (!readerNav) return;
  if (e.key === 'ArrowRight' && readerNav.next) go(readerNav.next);
  if (e.key === 'ArrowLeft' && readerNav.prev) go(readerNav.prev);
  if (e.key === 'Escape') go(readerNav.back);
});

// Rewrite legacy #/ routes to clean paths on first load.
(function migrateOldHashRoutes() {
  if (!location.hash.startsWith('#/')) return;
  const [part, qs] = location.hash.replace(/^#\/?/, '').split('?');
  const seg = part.split('/').filter(Boolean).map(decodeURIComponent);
  const params = new URLSearchParams(qs || '');
  let url = null;
  switch (seg[0]) {
    case undefined: url = '/'; break;
    case 'populer': url = '/popular'; break;
    case 'katalog': {
      const u = new URLSearchParams();
      if (seg[1] && Number(seg[1]) > 1) u.set('page', seg[1]);
      if (params.get('type')) u.set('type', params.get('type'));
      if (params.get('letter')) u.set('letter', params.get('letter'));
      const s = u.toString();
      url = '/explore' + (s ? '?' + s : '');
      break;
    }
    case 'cari': {
      if (!seg[1]) break;
      const u = new URLSearchParams({ q: seg[1] });
      if (seg[2]) u.set('page', seg[2]);
      url = '/search?' + u.toString();
      break;
    }
    case 'genre':
      url = seg[1] ? `/genre/${seg[1]}` + (seg[2] && Number(seg[2]) > 1 ? `?page=${seg[2]}` : '') : '/genre';
      break;
    case 'komik': url = seg[1] ? `/manga/${seg[1]}` : '/'; break;
    case 'baca': url = seg[1] && seg[2] ? `/read/${seg[1]}/${seg[2]}` : '/'; break;
    case 'koleksi': case 'favorit': url = '/collection'; break;
    case 'riwayat': url = '/collection?tab=history'; break;
  }
  if (url) window.history.replaceState(null, '', url);
})();

(function initReaderHistory() {
  const seg = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  if (seg[0] === 'read' && seg[1] && !window.history.state?.inReader) {
    const detail = `/manga/${encodeURIComponent(seg[1])}`;
    window.history.replaceState({ inReader: false }, '', detail);
    window.history.pushState({ inReader: true }, '', location.pathname + location.search);
    _navCount = 1;
  }
})();

route();
</script>
