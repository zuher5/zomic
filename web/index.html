<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="description" content="Zomic — baca komik, manga, manhwa, dan manhua. Katalog lengkap, pembaca vertikal tanpa gangguan.">
<title>Zomic — Baca Komik</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#0b0c0e; --surface:#111317; --surface2:#181b20; --line:#292d34;
  --text:#f1f1ed; --muted:#8c9199; --accent:#d7ff4f; --on-accent:#0b0c0e;
  --danger:#ff7a6b;
  --shade:rgba(11,12,14,.82);

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --r-xs:2px; --r-sm:4px; --r-md:8px;
  --maxw:1180px;
  --gutter:clamp(14px,4vw,28px);

  --t-label:.68rem; --t-meta:.75rem; --t-sm:.82rem; --t-body:.92rem;
  --t-h3:clamp(.95rem,3.4vw,1.05rem);
  --t-h2:clamp(1.02rem,3.6vw,1.2rem);
  --t-h1:clamp(1.5rem,7vw,2.1rem);

  --header-h:52px;
  --nav-h:calc(56px + env(safe-area-inset-bottom));
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f2ed; --surface:#faf9f5; --surface2:#e8e7e1; --line:#d5d4ce;
  --text:#151618; --muted:#6d7075; --accent:#5f7a00; --on-accent:#faf9f5;
  --danger:#b3261e;
  --shade:rgba(243,242,237,.86);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px;line-height:1.55;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
::selection{background:var(--accent);color:var(--on-accent)}
h1,h2,h3,h4,p{margin:0}
hr{border:0;border-top:1px solid var(--line);margin:var(--sp-5) 0}

.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ============================================================
   HEADER
   ============================================================ */
header.top{
  position:sticky;top:0;z-index:60;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top .bar{display:flex;align-items:center;gap:var(--sp-2);height:var(--header-h)}
.brand{
  display:inline-flex;align-items:baseline;gap:2px;margin-right:auto;
  font-weight:800;font-size:1.02rem;letter-spacing:.14em;text-transform:uppercase;
}
.brand i{width:5px;height:5px;background:var(--accent);border-radius:50%;display:inline-block;margin-left:1px}
.icon-btn{
  display:grid;place-items:center;width:38px;height:38px;
  border:1px solid transparent;border-radius:var(--r-sm);color:var(--muted);
  transition:color .15s var(--ease),border-color .15s var(--ease);
}
.icon-btn:hover{color:var(--text);border-color:var(--line)}
.icon-btn svg{width:19px;height:19px}
.icon-btn[aria-expanded="true"]{color:var(--text);border-color:var(--line)}

.desknav{display:none}
.desknav a{
  font-size:var(--t-sm);color:var(--muted);padding:6px 0;position:relative;
  transition:color .15s var(--ease);
}
.desknav a:hover{color:var(--text)}
.desknav a[aria-current="page"]{color:var(--text)}
.desknav a[aria-current="page"]::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);
}

/* search field */
.search{display:flex;align-items:center;gap:var(--sp-2);width:100%}
.search input{
  flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:10px 2px;font-size:var(--t-body);
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-bottom-color:var(--accent)}
.search .go{
  font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  padding:9px 12px;background:var(--accent);color:var(--on-accent);border-radius:var(--r-sm);
}
.top .search-row{display:none;padding-bottom:var(--sp-3)}
.top.open .search-row{display:block}

/* ----- icons ----- */
.icn{display:inline-flex;vertical-align:-0.15em}
.icn svg{width:var(--icn,18px);height:var(--icn,18px)}
.back .icn svg,.cta .icn svg,.more .icn svg{width:14px;height:14px}
.btn .icn svg{width:15px;height:15px}
.fav .icn svg{width:17px;height:17px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.icn.filled svg{color:var(--accent)}

/* ============================================================
   BOTTOM NAV (mobile)
   ============================================================ */
.botnav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.botnav a{
  display:grid;justify-items:center;gap:3px;padding:9px 0 7px;color:var(--muted);
  font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
}
.botnav svg{width:20px;height:20px}
.botnav a[aria-current="page"]{color:var(--text)}
.botnav a[aria-current="page"] svg{stroke:var(--accent)}

main{display:block;padding-block:var(--sp-5) calc(var(--nav-h) + var(--sp-6))}
/* Blok pertama menempel dekat header: 24px padding main + 8px = ~32px. */
main > section.block:first-child{margin-top:var(--sp-2)}

/* ============================================================
   TYPOGRAPHY BLOCKS
   ============================================================ */
.label{
  font-size:var(--t-label);letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:700;
}
.page-head{margin-bottom:var(--sp-5)}
.page-head h1{
  font-size:var(--t-h1);line-height:1.08;font-weight:800;letter-spacing:-.03em;
  text-wrap:balance;margin-top:var(--sp-2);
}
.page-head .sub{margin-top:var(--sp-2);font-size:var(--t-sm);color:var(--muted)}

section.block{margin-top:var(--sp-6)}
.block-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);
  padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid var(--line);
}
/* Blok bertab: judul tanpa garis penuh, jarak diberi oleh ruang kosong saja. */
.block.tabs > .block-head{border-bottom:0;padding-bottom:0;margin-bottom:14px}
.block.tabs + section.block{margin-top:44px}
.block-head h2{font-size:var(--t-h2);font-weight:700;letter-spacing:-.02em;line-height:1.25}
.more{font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);white-space:nowrap}
.more:hover{color:var(--accent)}

/* ============================================================
   COMIC CARD
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-4) var(--sp-3)}
/* Varian "wide": cover lebih besar untuk blok editorial (rekomendasi). */
.grid.wide{grid-template-columns:repeat(2,1fr);gap:var(--sp-5) var(--sp-4)}
.grid.wide h3{font-size:var(--t-h2)}

.rail{
  display:flex;gap:var(--sp-3);overflow-x:auto;scroll-snap-type:x proximity;
  padding-bottom:var(--sp-2);margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.rail > *{flex:0 0 clamp(106px,29vw,150px);scroll-snap-align:start}

.comic{position:relative;min-width:0}
.comic .cover{
  position:relative;display:block;aspect-ratio:2/3;overflow:hidden;isolation:isolate;
  background:var(--surface2);border-radius:var(--r-xs);
}
.comic .cover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;transition:opacity .3s var(--ease)}
.comic .cover .ph,.dhead .cover .ph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:1.8rem;font-weight:800;color:var(--muted);opacity:.45;
}
.comic .cover::after{
  content:"";position:absolute;inset:0;z-index:2;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none;
}
[data-theme="light"] .comic .cover::after{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.comic h3{
  font-size:var(--t-h3);font-weight:600;line-height:1.25;margin-top:var(--sp-2);
  letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.comic .meta{
  display:flex;flex-wrap:wrap;gap:0 6px;margin-top:2px;
  font-size:var(--t-meta);color:var(--muted);
}
.comic .meta .dot{opacity:.5}
.tag{
  position:absolute;top:0;left:0;z-index:3;padding:3px 6px;
  font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  background:var(--shade);backdrop-filter:blur(6px);color:var(--text);
}
.tag.color{top:auto;bottom:0;background:var(--accent);color:var(--on-accent)}
.fav{
  position:absolute;top:0;right:0;z-index:4;width:38px;height:38px;display:grid;place-items:center;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:1.05rem;line-height:1;
}
.fav[aria-pressed="true"]{color:var(--accent)}
.comic .cover:hover img{opacity:.86}

/* ranked list */
.ranks{display:grid}
.ranks a{
  display:grid;grid-template-columns:22px 70px 1fr;align-items:center;
  column-gap:10px;background:var(--bg);padding:var(--sp-2) 0;
  border-top:1px solid var(--line);
}
.ranks a:first-child{border-top:0}
.ranks a:hover{background:var(--surface)}
.ranks .n{font-size:var(--t-meta);color:var(--muted);text-align:right}
.ranks .th{position:relative;aspect-ratio:2/3;background:var(--surface2);overflow:hidden;border-radius:var(--r-xs)}
.ranks .th img{width:100%;height:100%;object-fit:cover}
.ranks h3{font-size:15px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranks .meta{font-size:13px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranks .meta .dot{margin:0 5px;opacity:.5}

/* continue reading */
.cont{display:grid;gap:var(--sp-3)}
.resume{
  display:grid;grid-template-columns:86px 1fr;gap:var(--sp-4);align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--sp-4);position:relative;overflow:hidden;
}
.resume::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);pointer-events:none}
[data-theme="light"] .resume::after{box-shadow:none}
.resume .rcover{position:relative;aspect-ratio:2/3;background:var(--surface2);overflow:hidden;border-radius:var(--r-xs);display:grid;place-items:center}
.resume .rcover img{width:100%;height:100%;object-fit:cover}
.resume .rinfo{min-width:0;display:flex;flex-direction:column}
.resume .rtitle{font-size:var(--t-body);font-weight:700;line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.resume .rcap{font-size:var(--t-meta);color:var(--muted);margin-top:2px}
.resume .rprog{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3)}
/* Nama kelas khusus (bukan .rbar) agar tidak bentrok dengan toolbar reader
   yang position:fixed — dulu bar ini ikut jadi fixed & melayang di viewport. */
.resume .rtrack{flex:1;display:block;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.resume .rtrack span{display:block;height:100%;background:var(--accent);border-radius:2px}
.resume .rpct{font-size:var(--t-meta);color:var(--accent);white-space:nowrap}
.resume .rrow{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-top:var(--sp-3)}
.resume .rwhen{font-size:var(--t-meta);color:var(--muted)}
.resume .rgo{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-label);
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--text);white-space:nowrap}
.resume:hover .rgo{color:var(--accent)}
.resume .ph,.r2c .ph{position:absolute;font-size:1.9rem;font-weight:800;color:var(--muted);opacity:.5}

.rrow2{
  display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-2);border:1px solid transparent;border-radius:var(--r-sm);
}
.rrow2:hover{background:var(--surface);border-color:var(--line)}
.rrow2 .r2c{position:relative;aspect-ratio:2/3;background:var(--surface2);overflow:hidden;border-radius:var(--r-xs);display:grid;place-items:center}
.rrow2 .r2c img{width:100%;height:100%;object-fit:cover}
.rrow2 .r2t{min-width:0;display:flex;flex-direction:column}
.rrow2 .r2t strong{font-size:var(--t-sm);font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rrow2 .r2t span{font-size:var(--t-meta);color:var(--muted);margin-top:1px}
.rrow2 .r2go{color:var(--muted)}
.rrow2:hover .r2go{color:var(--text)}

/* segmented switch (semantic tabs) — underline hanya pada tab aktif */
.seg{display:flex;gap:18px;margin-bottom:var(--sp-3)}
.seg button{
  padding:0 0 6px;font-size:var(--t-sm);color:var(--muted);position:relative;font-weight:600;
}
.seg button[aria-selected="true"]{color:var(--text)}
.seg button[aria-selected="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);
}

/* genre index — parent grid transparan supaya baris terakhir yang tidak penuh
   tidak menampilkan blok warna berbeda (bekas background var(--line)) */
.glist{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:transparent}
.glist a{
  background:var(--bg);padding:var(--sp-3) var(--sp-2);font-size:var(--t-sm);
  min-height:46px;display:flex;align-items:center;
}
.glist a:hover{color:var(--accent);background:var(--surface)}
@media (min-width:600px){.glist{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.glist{grid-template-columns:repeat(4,1fr)}}

/* ============================================================
   FILTERS / PAGER / BUTTONS
   ============================================================ */
.filters{display:grid;gap:var(--sp-2);margin-bottom:var(--sp-4)}
.frow{
  display:flex;gap:var(--sp-1);overflow-x:auto;scrollbar-width:none;
  margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);
}
.frow::-webkit-scrollbar{display:none}
.frow a{
  padding:5px 9px;font-size:var(--t-meta);color:var(--muted);white-space:nowrap;
  border:1px solid transparent;border-radius:var(--r-sm);
}
.frow a:hover{color:var(--text)}
.frow a[aria-current="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.frow.az a{min-width:28px;text-align:center;padding-inline:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:var(--t-sm);font-weight:600;min-height:44px;
  transition:border-color .15s var(--ease),background .15s var(--ease);
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled,[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 11px;min-height:36px;font-size:var(--t-meta)}
.link{color:var(--accent)}
/* pembungkus teks di dalam grid/flex — mencegah teks panjang memaksa lebar kolom */
.txt{min-width:0}

.pager{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-6);flex-wrap:wrap}
.pager .info{font-size:var(--t-meta);color:var(--muted);margin-inline:auto}
.pager form{display:flex;gap:var(--sp-1)}
.pager input{
  width:64px;background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px;font-size:var(--t-meta);text-align:center;
}

/* ============================================================
   STATES
   ============================================================ */
.state{padding:var(--sp-7) 0;text-align:center}
.state p:not(.label){font-size:var(--t-sm);color:var(--muted);margin-top:var(--sp-2)}
.state .btn{margin-top:var(--sp-4)}
.state.err .label{color:var(--danger)}
.skel{background:var(--surface2);position:relative;overflow:hidden}
.skel::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--line),transparent);
  animation:sh 1.4s infinite;
}
@keyframes sh{100%{transform:translateX(100%)}}
.skel-line{height:11px;margin-top:var(--sp-2);border-radius:var(--r-xs)}
.skel-line.w80{width:80%}
.skel-line.w55{width:55%;height:8px}
.skel-line.title{height:26px;width:70%}
.skel-cover{aspect-ratio:2/3;border-radius:var(--r-xs)}

/* ============================================================
   DETAIL
   ============================================================ */
.back{
  display:inline-flex;align-items:center;gap:6px;font-size:var(--t-label);
  letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);
  margin-bottom:var(--sp-4);min-height:36px;
}
.back svg{width:15px;height:15px}
.back:hover{color:var(--text)}
.dhead{display:grid;grid-template-columns:minmax(112px,34vw) 1fr;gap:var(--sp-4)}
.dhead .cover{position:relative;aspect-ratio:2/3;background:var(--surface2);overflow:hidden;border-radius:var(--r-xs)}
.dhead .cover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}
.dhead h1{font-size:clamp(1.25rem,5.4vw,1.8rem);font-weight:800;letter-spacing:-.03em;line-height:1.12;text-wrap:balance}
.dhead .alt{font-size:var(--t-sm);color:var(--muted);margin-top:var(--sp-1)}
.genres{display:flex;flex-wrap:wrap;gap:0 6px;margin-top:var(--sp-3);font-size:var(--t-meta)}
.genres a{color:var(--muted);border-bottom:1px solid var(--line)}
.genres a:hover{color:var(--accent);border-color:var(--accent)}
.genres .dot{color:var(--muted);opacity:.5}

.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3);margin-top:var(--sp-5)}
.facts > div{border-top:1px solid var(--line);padding-top:var(--sp-2);min-width:0}
.facts dt{font-size:var(--t-label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts dd{margin:2px 0 0;font-size:var(--t-sm);font-weight:600;overflow-wrap:anywhere}
.actions{display:flex;gap:var(--sp-2);margin-top:var(--sp-5)}
.actions .btn{flex:1}
.actions .btn.icon{flex:0 0 48px;padding:0}
.syn{font-size:var(--t-body);color:var(--text);opacity:.9;white-space:pre-line}
.syn.clamped{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.syn-toggle{margin-top:var(--sp-2);font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}

/* chapter list */
.chapters{display:flex;flex-direction:column}
.chapters a{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-3) 0;border-top:1px solid var(--line);min-height:48px;
}
.chapters a:last-child{border-bottom:1px solid var(--line)}
.chapters a:hover{background:var(--surface)}
.chapters .ch{font-size:var(--t-sm);font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chapters .when{font-size:var(--t-meta);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chapters a.read .ch{color:var(--muted);font-weight:400}
.chapters a.read .label{font-size:.6rem;letter-spacing:.1em;color:var(--accent);opacity:.8}
.chapters a::before{content:"";width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.chapters a.read::before{background:var(--accent);opacity:.6}
.list-tools{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-2)}

/* history rows */
.hist{display:flex;flex-direction:column}
.hist a{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;border-top:1px solid var(--line);min-height:48px}
.hist a:last-child{border-bottom:1px solid var(--line)}
.hist .t{flex:1;min-width:0;font-size:var(--t-sm);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .c{font-size:var(--t-meta);color:var(--muted);white-space:nowrap}

/* ============================================================
   READER
   ============================================================ */
/* Reader selalu gelap, apa pun temanya: latar terang menyilaukan saat membaca
   halaman komik full-bleed. Token dipetakan ulang di scope ini saja. */
body[data-view="reader"]{
  background:#000;
  --bg:#000; --surface:#111317; --surface2:#181b20; --line:#292d34;
  --text:#f1f1ed; --muted:#8c9199; --shade:rgba(0,0,0,.72);
  --accent:#d7ff4f; --on-accent:#0b0c0e;
}
body[data-view="reader"] header.top,
body[data-view="reader"] .botnav{display:none}
body[data-view="reader"] main{padding:0;max-width:none}
body[data-view="reader"] .wrap{max-width:none;padding-inline:0}

.pages{width:100%;background:#000}
/* Sebelum termuat, gambar diberi tinggi minimum supaya tidak collapse ke 0px
   (yang membuat semua lazy image dianggap masuk viewport sekaligus).
   Setelah load, min-height dilepas agar rasio asli halaman komik dipertahankan. */
.pages img{display:block;width:100%;height:auto;background:#0e0e0e;min-height:60svh}
.pages img.done{min-height:0}
.pages .pfail{padding:var(--sp-5);text-align:center;color:#8c9199;font-size:var(--t-meta)}
@media (min-width:820px){
  .pages{max-width:780px;margin-inline:auto}
}

.rbar{
  position:fixed;left:0;right:0;z-index:70;
  background:var(--shade);backdrop-filter:blur(10px);
  transition:transform .22s var(--ease),opacity .22s var(--ease);
}
.rbar.top{
  top:0;padding-top:env(safe-area-inset-top);
  border-bottom:1px solid rgba(255,255,255,.1);
}
.rbar.bottom{
  bottom:0;padding-bottom:env(safe-area-inset-bottom);
  border-top:1px solid rgba(255,255,255,.1);
}
body:not(.chrome) .rbar.top{transform:translateY(-100%);opacity:0}
body:not(.chrome) .rbar.bottom{transform:translateY(100%);opacity:0}
.rbar .inner{display:flex;align-items:center;gap:var(--sp-2);height:52px;padding-inline:var(--sp-3);
  max-width:820px;margin-inline:auto}
.rbar .rmeta{flex:1;min-width:0;line-height:1.25}
.rbar .rmeta strong{display:block;font-size:var(--t-sm);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .rmeta span{font-size:var(--t-meta);color:var(--muted)}
.rbar .icon-btn:hover{border-color:rgba(255,255,255,.25)}
.rbar.bottom .inner{gap:var(--sp-3)}
.rbar.bottom .btn{border-color:rgba(255,255,255,.22);flex:1;min-height:40px;padding:8px 12px}
.rbar.bottom .pos{font-size:var(--t-meta);color:var(--muted);white-space:nowrap}
.progress{height:2px;background:var(--accent);width:0;transition:width .1s linear}

/* floating autoscroll — melayang tepat di atas tombol Next (tepi kanan bar
   bawah), warna senada accent. Sembunyi bersama chrome, tapi selalu tampil
   saat autoscroll sedang berjalan supaya bisa di-pause. */
.playfab{
  position:fixed;z-index:72;
  right:calc(max(0px,(100vw - 820px)/2) + 12px);
  bottom:calc(52px + env(safe-area-inset-bottom) + 12px);
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--accent);color:var(--on-accent);
  box-shadow:0 4px 14px rgba(0,0,0,.45);
  transition:transform .15s var(--ease),opacity .2s var(--ease);
}
.playfab:active{transform:scale(.92)}
.playfab svg{width:20px;height:20px;fill:currentColor;stroke:none}
body:not(.chrome):not(.autoscroll) .playfab{opacity:0;pointer-events:none}

.rend{padding:var(--sp-6) var(--gutter) calc(var(--sp-7) + 52px);text-align:center}
.rend .actions{max-width:420px;margin:var(--sp-4) auto 0}
.rend .btn{border-color:rgba(255,255,255,.22)}
.rend .btn.primary{border-color:transparent}

/* chapter jump sheet */
.sheet{
  position:fixed;inset:auto 0 0 0;z-index:80;max-height:70dvh;
  width:100%;max-width:560px;margin-inline:auto;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:var(--r-md) var(--r-md) 0 0;
  display:flex;flex-direction:column;color:var(--text);
  transform:translateY(101%);transition:transform .24s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet[data-open="true"]{transform:translateY(0)}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line)}
.sheet .slist{overflow-y:auto;padding:0 var(--sp-4) var(--sp-4);-webkit-overflow-scrolling:touch}
.sheet .slist a{display:flex;justify-content:space-between;gap:var(--sp-3);
  padding:var(--sp-3) 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.sheet .slist a[aria-current="true"]{color:var(--accent);font-weight:700}
.scrim{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (min-width:480px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .grid.wide{grid-template-columns:repeat(3,1fr)}
  .facts{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:768px){
  .grid{grid-template-columns:repeat(4,1fr);gap:var(--sp-5) var(--sp-4)}
  .grid.wide{grid-template-columns:repeat(4,1fr)}
  .grid.wide h3{font-size:var(--t-h3)}
  .rail > *{flex-basis:clamp(130px,17vw,170px)}
  .ranks{grid-template-columns:repeat(2,1fr);column-gap:var(--sp-5)}
  .ranks a{padding-inline:var(--sp-2)}
  .ranks a:nth-child(-n+2){border-top:0}
  .dhead{grid-template-columns:220px 1fr;gap:var(--sp-5)}
  .facts{grid-template-columns:repeat(4,1fr)}
  .actions{max-width:520px}
  .glist a{padding-inline:var(--sp-2)}
}
@media (min-width:900px){
  .botnav{display:none}
  main{padding-bottom:var(--sp-7)}
  .top .bar{height:60px;gap:var(--sp-4)}
  .brand{margin-right:var(--sp-2)}
  .desknav{display:flex;gap:var(--sp-4);margin-right:auto}
  .top .bar .search{max-width:280px;flex:0 1 280px}
  .top .bar .search-inline{display:flex}
  .top #searchToggle{display:none}
  .top.open .search-row{display:none}
}
@media (max-width:899px){
  .top .bar .search-inline{display:none}
}
@media (max-width:479px){
  .resume{grid-template-columns:64px 1fr;gap:var(--sp-3);padding:var(--sp-3)}
  .resume .rcover{border-radius:var(--r-xs)}
  .resume .rrow{flex-wrap:wrap;gap:var(--sp-2) var(--sp-3)}
  .resume .rgo{margin-left:auto}
  .resume .ph,.r2c .ph{font-size:1.5rem}
}
@media (min-width:1024px){
  .grid{grid-template-columns:repeat(5,1fr)}
  .grid.wide{grid-template-columns:repeat(5,1fr)}
}
@media (min-width:1280px){
  .grid{grid-template-columns:repeat(6,1fr)}
}
@media (hover:none){
  .comic .cover:hover img{opacity:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .rail{scroll-behavior:auto}
}
/* Cover dengan rasio menyimpang jauh dari 2:3 (banner horizontal / hampir kotak)
   ditampilkan utuh (contain) supaya tidak terpotong oleh object-fit:cover.
   Kelas .wide dipasang via JS setelah gambar selesai dimuat. */
img[data-cover].wide{object-fit:contain}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#/" aria-label="Zomic — beranda">Zomic<i aria-hidden="true"></i></a>

      <nav class="desknav" id="desknav" aria-label="Navigasi utama"></nav>
      <form class="search search-inline" data-search role="search">
        <input type="search" name="q" placeholder="Cari judul komik…" aria-label="Cari komik" autocomplete="off">
      </form>

      <button class="icon-btn" id="searchToggle" aria-expanded="false" aria-controls="searchRow" aria-label="Cari komik">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.5-4.5"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Ganti tema"></button>
    </div>

    <div class="search-row" id="searchRow">
      <form class="search" data-search role="search">
        <input type="search" name="q" placeholder="Cari judul, penulis…" aria-label="Cari komik" autocomplete="off">
        <button class="go" type="submit">Cari</button>
      </form>
    </div>
  </div>
</header>

<main id="view" class="wrap" aria-live="polite"></main>

<nav class="botnav" id="botnav" aria-label="Navigasi utama"></nav>

<script>
"use strict";

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const view = $('#view');
const IMG = u => u ? '/api/img?url=' + encodeURIComponent(u) : '';
/* thumbnail.komiku.* menyediakan thumbnail crop kecil (resize=240,150 landscape di
   /terbaru, resize=160,220 portrait di katalog) yang kalau dipaksa di kotak portrait
   2/3 jadi terpotong & buram. Di sini kita minta gambar asli (tanpa param resize)
   lalu biarkan image proxy resize server-side dengan aspect ratio dipertahankan
   (tidak crop). Host thumbnail bisa .org / .to / .id. */
const THUMB_HOST = /(^|\.)thumbnail\.komiku\.(org|to|id)$/i;
const opt = (u, w, fmt = 'auto', q = 78) => {
  if (!u || !/^https?:\/\//i.test(u)) return '';
  let base = u;
  try {
    const url = new URL(u);
    if (THUMB_HOST.test(url.hostname)) base = url.origin + url.pathname;
  } catch {}
  return IMG(base) + `&w=${w}&format=${fmt}&q=${q}`;
};
const srcset = u => `${opt(u, 240)} 240w, ${opt(u, 400)} 400w, ${opt(u, 800)} 800w`;
const coverImg = (u, w, sizes, eager = false) => u
  ? `<img data-cover ${eager ? '' : 'loading="lazy"'} decoding="async" src="${opt(u, w)}" srcset="${srcset(u)}" sizes="${sizes}" alt="" onerror="this.remove()">`
  : '';
/* sizes mengikuti layout aktual card cover 2/3 (bukan 1x/2x, tapi lebar kontainer). */
const S_GRID = '(min-width:1280px) 174px, (min-width:1024px) 18vw, (min-width:768px) 22vw, (min-width:480px) 29vw, 45vw';
const S_RAIL = '(min-width:768px) 150px, 29vw';
const S_DETAIL = '(min-width:768px) 220px, 34vw';
const S_RESUME = '(max-width:479px) 64px, 86px';
const S_R2 = '40px';
const S_TH = '70px';
/* Cover rasio ekstrem (banner landscape r>1, atau super tinggi r<0.5) diberi
   class .wide → object-fit:contain supaya tidak terpotong. Cover portrait biasa
   (~0.7, sudah di-resolve ke manga_thumbnail oleh backend) tetap object-fit:cover
   agar tidak letterbox. Load event tidak bubble, jadi dipasang di fase capture. */
function fitCover(img) {
  if (img.dataset.fitDone) return;
  img.dataset.fitDone = '1';
  const r = img.naturalWidth / img.naturalHeight;
  if (r > 0 && (r > 1.0 || r < 0.5)) img.classList.add('wide');
}
document.addEventListener('load', e => {
  const t = e.target;
  // 'cover' in t.dataset (bukan truthiness): data-cover dipasang tanpa nilai,
  // jadi dataset.cover === '' yang falsy — cek keberadaan atribut, bukan nilainya.
  if (t instanceof HTMLImageElement && 'cover' in t.dataset) fitCover(t);
}, true);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOT = '<span class="dot" aria-hidden="true">·</span>';
const joinDot = parts => parts.filter(Boolean).map(esc).join(DOT);
const detailHref = slug => `#/komik/${encodeURIComponent(slug)}`;
const readHref = (slug, ch) => `#/baca/${encodeURIComponent(slug)}/${encodeURIComponent(ch)}`;
const initials = t => esc(String(t || '?').trim().charAt(0).toUpperCase());

function timeAgo(ts) {
  const s = Math.max(1, (Date.now() - ts) / 1000);
  if (s < 3600) return Math.floor(s / 60) + ' mnt lalu';
  if (s < 86400) return Math.floor(s / 3600) + ' jam lalu';
  if (s < 604800) return Math.floor(s / 86400) + ' hari lalu';
  return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
}

const ICON = {
  home: '<path d="M4 10.5 12 4l8 6.5V20H4z"/>',
  grid: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  star: '<path d="M12 4l2.4 5 5.6.7-4 3.9 1 5.4-5-2.7-5 2.7 1-5.4-4-3.9 5.6-.7z"/>',
  starF: '<path fill="currentColor" stroke="none" d="M12 2.8l3 6.1 6.7 1-4.9 4.7 1.2 6.6-6-3.1-6 3.1 1.2-6.6L2.3 9.9l6.7-1z"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 1.8"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8.2 8.2 0 1 0 10.5 10.5z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  play: '<path d="M7 4.5l11 7.5-11 7.5z"/>',
  pause: '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>',
  chevL: '<path d="M15 6l-6 6 6 6"/>',
  chevR: '<path d="M9 6l6 6-6 6"/>',
  arrowL: '<path d="M15 5l-7 7 7 7"/>',
  ellipsis: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  list: '<path d="M5 7h14M5 12h14M5 17h9"/>',
  filter: '<path d="M3 5h18l-6.5 7.5V19l-5 2.5v-9z"/>',
  sort: '<path d="M4 7h16M7 12h10M10 17h4"/>',
  tags: '<path d="M3 10V3h7l11 11-7 7L3 16V10z"/><path d="M8 8h.01"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
};
const svg = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;
const icon = (name, cls = '') => `<span class="icn" aria-hidden="true">${svg(name, cls)}</span>`;
const favIcn = on => icon(on ? 'starF' : 'star', on ? 'filled' : '');

/* ============================================================
   STORAGE — favorit, riwayat, chapter terbaca, tema
   ============================================================ */
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const favs = () => store.get('zomic:favs', {});
const isFav = s => !!favs()[s];
function toggleFav(slug, data) {
  const f = favs();
  if (f[slug]) delete f[slug]; else f[slug] = { slug, ...data, at: Date.now() };
  store.set('zomic:favs', f);
  return !!f[slug];
}
const history = () => store.get('zomic:history', []);
function pushHistory(entry) {
  const h = history().filter(x => x.slug !== entry.slug);
  h.unshift({ ...entry, at: Date.now() });
  store.set('zomic:history', h.slice(0, 60));
}
const readKey = s => 'zomic:read:' + s;
const readSet = s => new Set(store.get(readKey(s), []));
function markRead(slug, ch) {
  const set = readSet(slug); set.add(String(ch));
  store.set(readKey(slug), [...set]);
}

/* ============================================================
   FETCH + STATES
   ============================================================ */
async function api(path) {
  const res = await fetch(path);
  if (!res.ok) {
    let msg = res.status + ' ' + res.statusText;
    try { const j = await res.json(); if (j.detail) msg = typeof j.detail === 'string' ? j.detail : msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}
const empty = (title, note = '') => `<div class="state">
  <p class="label">${esc(title)}</p>${note ? `<p>${esc(note)}</p>` : ''}</div>`;
function fail(e) {
  view.innerHTML = `<div class="state err">
    <p class="label">Gagal memuat</p><p>${esc(e.message)}</p>
    <button class="btn" data-retry>Coba lagi</button></div>`;
}
const skelCard = () => `<div class="comic" aria-hidden="true">
  <div class="skel skel-cover"></div><div class="skel skel-line w80"></div>
  <div class="skel skel-line w55"></div></div>`;
const skelGrid = n => `<div class="grid">${Array.from({ length: n }, skelCard).join('')}</div>`;
const skelRail = n => `<div class="rail">${Array.from({ length: n }, skelCard).join('')}</div>`;

/* ============================================================
   COMIC CARD
   ============================================================ */
function card(c, sizes = S_GRID) {
  const slug = c.slug || '';
  const href = detailHref(slug);
  const meta = joinDot([c.chapter, c.update, c.genre, c.status].filter(Boolean).slice(0, 2));
  const fav = isFav(slug);
  return `<article class="comic">
    <a class="cover" href="${href}" tabindex="-1" aria-hidden="true">
      <span class="ph">${initials(c.title)}</span>
      ${c.cover ? coverImg(c.cover, 300, sizes) : ''}
      ${c.type ? `<span class="tag">${esc(c.type)}</span>` : ''}
      ${c.colored ? '<span class="tag color">Warna</span>' : ''}
    </a>
    <button class="fav" data-fav="${esc(slug)}" data-title="${esc(c.title)}" data-cover="${esc(c.cover || '')}"
      aria-pressed="${fav}" aria-label="${fav ? 'Hapus dari favorit' : 'Tambah ke favorit'}">${favIcn(fav)}</button>
    <h3><a href="${href}">${esc(c.title)}</a></h3>
    ${meta ? `<p class="meta">${meta}</p>` : ''}
  </article>`;
}
const gridOf = (items, cls = 'grid') => items.length
  ? `<div class="${cls}">${items.map(c => card(c, S_GRID)).join('')}</div>`
  : empty('Kosong', 'Tidak ada komik ditemukan.');
const railOf = items => `<div class="rail">${items.map(c => card(c, S_RAIL)).join('')}</div>`;

function pager(page, hasNext, hrefFor, totalPages) {
  const cur = Number(page) || 1;
  return `<nav class="pager" aria-label="Halaman">
    ${cur > 1 ? `<a class="btn sm" href="${hrefFor(cur - 1)}" rel="prev">${icon('chevL')} Sebelumnya</a>`
              : `<span class="btn sm" aria-disabled="true">${icon('chevL')} Sebelumnya</span>`}
    <span class="info mono">${totalPages ? `${cur} / ${totalPages}` : `Hal. ${cur}`}</span>
    ${hasNext ? `<a class="btn sm" href="${hrefFor(cur + 1)}" rel="next">Berikutnya ${icon('chevR')}</a>`
              : `<span class="btn sm" aria-disabled="true">Berikutnya ${icon('chevR')}</span>`}
    ${totalPages > 1 ? `<form data-jump="${esc(hrefFor('__P__'))}">
      <input class="mono" type="number" min="1" max="${totalPages}" placeholder="Hal." aria-label="Lompat ke halaman">
      <button class="btn sm" type="submit">Go</button></form>` : ''}
  </nav>`;
}

const head = (label, title, sub = '') => `<div class="page-head">
  <p class="label">${esc(label)}</p><h1>${esc(title)}</h1>
  ${sub ? `<p class="sub">${sub}</p>` : ''}</div>`;
const block = (title, body, more = '', cls = '') => `<section class="block${cls ? ' ' + cls : ''}">
  <div class="block-head"><h2>${esc(title)}</h2>${more}</div>${body}</section>`;

/* ============================================================
   HOME
   ============================================================ */
// Progress bacaan yang bermakna: posisi chapter terakhir / jumlah chapter.
// `pos` adalah peringkat urutan chapter di daftar, jadi label non-urutan
// (mis. "13.5", "oneshoot") tetap dihitung benar. Tanpa data, -1 → teks.
function contPct(e) {
  const pos = Math.round(Number(e.pos));
  const total = Math.round(Number(e.total));
  if (total > 0 && pos > 0) return Math.max(0, Math.min(100, Math.round(pos / total * 100)));
  const ch = Number(e.ch);
  if (total > 0 && ch > 0) return Math.max(0, Math.min(100, Math.round(ch / total * 100)));
  return -1;
}
function resumeCard(e) {
  const pct = contPct(e);
  return `<a class="resume" href="${readHref(e.slug, e.ch)}">
    <span class="rcover"><span class="ph">${initials(e.title)}</span>${e.cover ? coverImg(e.cover, 200, S_RESUME) : ''}</span>

      const tabs = popular.map((g, i) =>
        `<button role="tab" id="pop-t${i}" aria-controls="pop-p${i}" aria-selected="${i === 0}" data-pop="${i}">${esc(g.title.replace(/\s*Populer$/i, ''))}</button>`).join('');
      const panels = popular.map((g, i) => `<div role="tabpanel" id="pop-p${i}" aria-labelledby="pop-t${i}" data-pop-panel="${i}" ${i ? 'hidden' : ''}>
        <div class="ranks">${g.items.slice(0, 4).map((c, n) => `<a href="${detailHref(c.slug)}">
          <span class="n mono">${String(n + 1).padStart(2, '0')}</span>
          <span class="th">${c.cover ? coverImg(c.cover, 120, S_TH) : ''}</span>
          <span class="txt"><h3>${esc(c.title)}</h3>
            <span class="meta">${joinDot([c.chapter, c.readers || c.genre])}</span></span>
        </a>`).join('')}</div></div>`).join('');
      html += block('Populer Minggu Ini', `<div class="seg" role="tablist" aria-label="Tipe komik populer">${tabs}</div>${panels}`,
        `<a class="more" href="#/populer">Lihat semua ${icon('chevR')}</a>`, 'tabs');
    }

    if (recommended.length) {
      html += block('Rekomendasi Untukmu', gridOf(recommended.slice(0, 10), 'grid wide'));
    }

    view.innerHTML = html;

    // Tab populer: klik + navigasi panah (pola tablist WAI-ARIA).
    const seg = $('.seg', view);
    if (seg) {
      const tabsEl = $$('[data-pop]', seg);
      const select = b => {
        tabsEl.forEach(x => {
          const on = x === b;
          x.setAttribute('aria-selected', String(on));
          x.tabIndex = on ? 0 : -1;
        });
        $$('[data-pop-panel]', view).forEach(p => { p.hidden = p.dataset.popPanel !== b.dataset.pop; });
      };
      select(tabsEl[0]);
      seg.addEventListener('click', e => {
        const b = e.target.closest('[data-pop]');
        if (b) select(b);
      });
      seg.addEventListener('keydown', e => {
        const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        const i = tabsEl.findIndex(x => x.getAttribute('aria-selected') === 'true');
        const nextTab = tabsEl[(i + step + tabsEl.length) % tabsEl.length];
        select(nextTab); nextTab.focus();
      });
    }
  } catch (e) { fail(e); }
}

const TYPES = [['', 'Semua'], ['manga', 'Manga'], ['manhwa', 'Manhwa'], ['manhua', 'Manhua']];
const LETTERS = ['', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];

async function pageCatalog(page, params) {
  const type = params.get('type') || '';
  const letter = (params.get('letter') || '').toUpperCase();
  const href = p => {
    const u = new URLSearchParams();
    if (type) u.set('type', type);
    if (letter) u.set('letter', letter);
    const s = u.toString();
    return `#/katalog/${p}${s ? '?' + s : ''}`;
  };
  const filterHref = (t, L) => {
    const u = new URLSearchParams();
    if (t) u.set('type', t);
    if (L) u.set('letter', L);
    const s = u.toString();
    return `#/katalog/1${s ? '?' + s : ''}`;
  };
  const filters = `<div class="filters">
    <div class="frow" role="group" aria-label="Filter tipe">
      ${TYPES.map(([v, l]) => `<a href="${filterHref(v, letter)}" aria-current="${v === type}">${l}</a>`).join('')}
    </div>
    <div class="frow az" role="group" aria-label="Filter huruf awal">
      ${LETTERS.map(L => `<a href="${filterHref(type, L)}" aria-current="${L === letter}">${L || 'A–Z'}</a>`).join('')}
    </div>
  </div>`;
  const title = TYPES.find(([v]) => v === type)?.[1] || 'Semua';
  const h = head('Katalog', title === 'Semua' ? 'Semua komik' : title);
  view.innerHTML = h + filters + skelGrid(10);
  try {
    const qs = new URLSearchParams({ page });
    if (type) qs.set('type', type);
    if (letter) qs.set('letter', letter);
    const d = await api('/api/catalog?' + qs);
    const sub = joinDot([
      d.total ? d.total.toLocaleString('id-ID') + ' judul' : '',
      d.total_pages ? d.total_pages + ' halaman' : '',
      letter ? 'Huruf ' + letter : '',
    ]);
    view.innerHTML = head('Katalog', title === 'Semua' ? 'Semua komik' : title, sub) + filters +
      gridOf(d.items) + pager(d.page, d.has_next, href, d.total_pages);
  } catch (e) { fail(e); }
}

aria-pressed="${fav}" aria-label="${fav ? 'Hapus dari favorit' : 'Tambah ke favorit'}">${favIcn(fav)}</button>

    const i = chapters.findIndex(c => String(c.ch) === String(ch));

    const next = i >= 0 && i < chapters.length - 1 ? chapters[i + 1] : null;
    const title = detail?.title || slug;
    markRead(slug, ch);
    if (detail) pushHistory({ slug, ch, title, cover: detail.cover || '', pos: i >= 0 ? i + 1 : 0, total: chapters.length });

          onload="this.classList.add('done')"

      </div>

      <div class="rend">
        <p class="label">Chapter ${esc(ch)} selesai</p>
        <div class="actions">
          ${nav(prev, '', -1)}
          <a class="btn" href="${back}">Detail</a>
          ${nav(next, 'primary', 1)}
        </div>
      </div>

      <div class="rbar bottom">
        <div class="inner">
          ${nav(prev, '', -1)}
          <span class="pos mono" id="pos">1/${pages.length}</span>
          ${nav(next, 'primary', 1)}
        </div>
      </div>

      <button class="playfab" id="autoScroll" aria-label="Autoscroll" aria-pressed="false">${svg('play')}</button>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Daftar chapter" aria-hidden="true" inert>
        <div class="shead"><span class="label">${chapters.length} chapter</span>
          <button class="icon-btn" id="sheetClose" aria-label="Tutup daftar chapter">${svg('x')}</button></div>
        <div class="slist">${[...chapters].reverse().map(c =>
          `<a href="${readHref(slug, c.ch)}" aria-current="${String(c.ch) === String(ch)}">
            <span>${esc(c.title || 'Chapter ' + c.ch)}</span>
            <span class="muted mono">${esc(c.date || '')}</span></a>`).join('')}</div>
      </div>`;

    window.scrollTo(0, 0);
    readerNav = {
      prev: prev && readHref(slug, prev.ch),
      next: next && readHref(slug, next.ch),
      back,
      total: pages.length,
    };
    showChrome(true);
    chromeTimer = setTimeout(() => showChrome(false), 1800);

    const sheet = $('#sheet'), scrim = $('#scrim'), sheetBtn = $('#sheetBtn');
    const setSheet = open => {
      sheet.dataset.open = String(open);
      scrim.dataset.open = String(open);
      sheet.setAttribute('aria-hidden', String(!open));
      sheet.toggleAttribute('inert', !open);
      sheetBtn.setAttribute('aria-expanded', String(open));
      if (open) {
        showChrome(true); clearTimeout(chromeTimer);
        const cur = $('.slist a[aria-current="true"]', sheet);
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
        (cur || $('#sheetClose'))?.focus?.({ preventScroll: true });
      } else {
        sheetBtn.focus?.({ preventScroll: true });
      }
    };
    sheetBtn.onclick = () => setSheet(sheet.dataset.open !== 'true');
    $('#sheetClose').onclick = () => setSheet(false);
    scrim.onclick = () => setSheet(false);
    closeSheet = () => setSheet(false);
    $('#pages').addEventListener('click', () => {
      if (sheet.dataset.open === 'true') return setSheet(false);
      clearTimeout(chromeTimer);
      showChrome(!document.body.classList.contains('chrome'));
    });
    $('#autoScroll').onclick = toggleAutoscroll;
  } catch (e) { document.body.dataset.view = ''; fail(e); }
}

let chromeTimer = null, lastY = 0, ticking = false, closeSheet = null;
function showChrome(on) { document.body.classList.toggle('chrome', on); }

/* ============================================================
   AUTOSCROLL — tombol play melayang di atas Next (toggle play/pause)
   ============================================================ */
let autoRaf = null, autoLast = 0;
const AUTO_PX = 96; // piksel per detik, kecepatan tetap

function stopAutoscroll() {
  if (autoRaf) { cancelAnimationFrame(autoRaf); autoRaf = null; }
  document.body.classList.remove('autoscroll');
  const fab = $('#autoScroll');
  if (fab) {
    fab.innerHTML = svg('play');
    fab.setAttribute('aria-pressed', 'false');
    fab.setAttribute('aria-label', 'Autoscroll');
  }
}

function startAutoscroll() {
  document.body.classList.add('autoscroll');
  const fab = $('#autoScroll');
  if (fab) {
    fab.innerHTML = svg('pause');
    fab.setAttribute('aria-pressed', 'true');
    fab.setAttribute('aria-label', 'Berhenti autoscroll');
  }
  autoLast = performance.now();
  const step = t => {
    const px = Math.max(0.5, (t - autoLast) / 1000 * AUTO_PX);
    autoLast = t;
    window.scrollBy(0, px);
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
      stopAutoscroll();
      return;
    }
    autoRaf = requestAnimationFrame(step);
  };
  autoRaf = requestAnimationFrame(step);
}

function toggleAutoscroll() {
  if (autoRaf) stopAutoscroll(); else startAutoscroll();
}

function onReaderScroll() {
  const y = window.scrollY;
  if (Math.abs(y - lastY) > 10) {
    showChrome(y < lastY || y < 40);
    lastY = y;
  }
  const el = $('#pages'), prog = $('#prog'), pos = $('#pos');
  if (el && prog) {
    const max = el.offsetTop + el.offsetHeight - window.innerHeight;
    const pct = max > 0 ? Math.min(1, Math.max(0, y / max)) : 1;
    prog.style.width = (pct * 100).toFixed(1) + '%';
    if (pos && readerNav?.total) pos.textContent = `${Math.max(1, Math.ceil(pct * readerNav.total))}/${readerNav.total}`;
  }
}
window.addEventListener('scroll', () => {
  if (document.body.dataset.view !== 'reader' || ticking) return;
  ticking = true;
  requestAnimationFrame(() => { onReaderScroll(); ticking = false; });
}, { passive: true });

const NAV = [
  { href: '#/', key: '', label: 'Beranda', icon: 'home' },
  { href: '#/katalog/1', key: 'katalog', label: 'Jelajah', icon: 'grid' },
  { href: '#/genre', key: 'genre', label: 'Genre', icon: 'tags' },
  { href: '#/favorit', key: 'favorit', label: 'Favorit', icon: 'star' },
  { href: '#/riwayat', key: 'riwayat', label: 'Riwayat', icon: 'clock' },
];
const DESKNAV = [...NAV];

function renderNav(active) {
  $('#botnav').innerHTML = NAV.map(n =>
    `<a href="${n.href}" ${n.key === active ? 'aria-current="page"' : ''}>${svg(n.icon)}<span>${n.label}</span></a>`).join('');
  $('#desknav').innerHTML = DESKNAV.map(n =>
    `<a href="${n.href}" ${n.key === active ? 'aria-current="page"' : ''}>${n.label}</a>`).join('');
}

function route() {
  readerNav = null;
  closeSheet = null;
  stopAutoscroll();
  clearTimeout(chromeTimer);
  document.body.classList.remove('chrome');
  document.body.dataset.view = '';
  $('#top').classList.remove('open');
  $('#searchToggle').setAttribute('aria-expanded', 'false');
  lastY = 0;

  const hash = location.hash.replace(/^#\/?/, '');
  const [part, ...rest] = hash.split('?');
  const seg = part.split('/').filter(Boolean).map(decodeURIComponent);
  const params = new URLSearchParams(rest.join('?'));
  renderNav(seg[0] || '');
  window.scrollTo(0, 0);

  switch (seg[0]) {
    case undefined: return pageHome();
    case 'populer': return pagePopuler();
    case 'katalog': return pageCatalog(Number(seg[1]) || 1, params);
    case 'cari': return seg[1] ? pageSearch(seg[1], Number(seg[2]) || 1) : pageHome();
    case 'genre': return seg[1] ? pageGenre(seg[1], Number(seg[2]) || 1) : pageGenres();
    case 'berwarna': return pageColored();
    case 'favorit': return pageFavs();
    case 'riwayat': return pageHistory();
    case 'komik': return pageDetail(seg[1]);
    case 'baca': return pageReader(seg[1], seg[2]);
    default: return pageHome();
  }
}
window.addEventListener('hashchange', route);

/* ============================================================
   GLOBAL INTERACTION
   ============================================================ */
$$('[data-search]').forEach(f => f.addEventListener('submit', e => {
  e.preventDefault();
  const q = f.querySelector('input').value.trim();
  if (q) location.hash = `#/cari/${encodeURIComponent(q)}/1`;
  f.querySelector('input').blur();
}));

$('#searchToggle').onclick = () => {
  const top = $('#top');
  const open = top.classList.toggle('open');
  $('#searchToggle').setAttribute('aria-expanded', String(open));
  if (open) $('#searchRow input').focus();
};

document.addEventListener('click', e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const fav = t.closest('[data-fav]');
  if (fav) {
    e.preventDefault();
    const on = toggleFav(fav.dataset.fav, { title: fav.dataset.title, cover: fav.dataset.cover });
    fav.innerHTML = favIcn(on);
    fav.setAttribute('aria-pressed', String(on));
    fav.setAttribute('aria-label', on ? 'Hapus dari favorit' : 'Tambah ke favorit');
    return;
  }
  if (t.closest('[data-retry]')) { route(); return; }
  const back = t.closest('[data-back]');
  if (back) {
    if (window.history.length > 1) window.history.back(); else location.hash = '#/';
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-jump]');
  if (!f) return;
  e.preventDefault();
  const n = Number(f.querySelector('input').value);
  if (n > 0) location.hash = f.dataset.jump.replace('__P__', n);
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t instanceof Element && t.matches('input,select,textarea')) return;
  if (e.key === 'Escape' && $('#sheet')?.dataset.open === 'true') { closeSheet?.(); return; }
  if (!readerNav) return;
  if (e.key === 'ArrowRight' && readerNav.next) location.hash = readerNav.next;
  if (e.key === 'ArrowLeft' && readerNav.prev) location.hash = readerNav.prev;
  if (e.key === 'Escape') location.hash = readerNav.back;
});

/* ============================================================
   THEME
   ============================================================ */
const applyTheme = t => {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = svg(t === 'light' ? 'sun' : 'moon');
  $('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f3f2ed' : '#0b0c0e');
};
applyTheme(store.get('zomic:theme', 'dark'));
$('#themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  store.set('zomic:theme', t); applyTheme(t);
};

route();
</script>
</body>
</html>
